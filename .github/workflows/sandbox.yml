# Weekly integration run against the real Namecheap sandbox API plus fixture
# drift detection. It NEVER runs on pull_request or push: the sandbox is
# slow/flaky and its credentials must never fan out to fork PRs. Triggers are
# limited to a weekly schedule and manual dispatch.
#
# The API key comes from the org-level NAMECHEAP_API_KEY secret. The suite
# additionally needs a whitelisted client IP; GitHub-hosted runner egress IPs
# cannot be whitelisted, so until NAMECHEAP_SANDBOX_CLIENTIP is provided (or
# this job moves onto the whitelisted EC2 runner used by acceptance.yml) the
# suite skips cleanly and this workflow is a no-op.
# Live acceptance against the production API runs separately in acceptance.yml
# on an EC2 runner holding this repo's whitelisted Elastic IP.
name: Sandbox integration

on:
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write # to post/refresh the drift note on the tracking issue

env:
  TRACKING_ISSUE: "122"

jobs:
  sandbox:
    name: Sandbox suite + fixture drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run sandbox suite
        id: suite
        env:
          NAMECHEAP_USER_NAME: saTerraformProvider
          NAMECHEAP_API_USER: saTerraformProvider
          NAMECHEAP_API_KEY: ${{ secrets.NAMECHEAP_API_KEY }}
          NAMECHEAP_CLIENT_IP: ${{ secrets.NAMECHEAP_SANDBOX_CLIENTIP }}
          NAMECHEAP_TEST_DOMAIN: terraform-provider-test.net
          NAMECHEAP_USE_SANDBOX: "true"
        run: make testacc

      - name: Re-capture fixtures and diff against committed corpus
        id: drift
        if: ${{ !cancelled() }}
        env:
          NAMECHEAP_USER_NAME: saTerraformProvider
          NAMECHEAP_API_USER: saTerraformProvider
          NAMECHEAP_API_KEY: ${{ secrets.NAMECHEAP_API_KEY }}
          NAMECHEAP_CLIENT_IP: ${{ secrets.NAMECHEAP_SANDBOX_CLIENTIP }}
          NAMECHEAP_TEST_DOMAIN: terraform-provider-test.net
          NAMECHEAP_USE_SANDBOX: "true"
        run: |
          make update-fixtures
          if git diff --quiet -- namecheaptest/fixtures; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            git diff -- namecheaptest/fixtures > fixture-drift.diff
          fi

      - name: Upload fixture drift diff
        if: ${{ steps.drift.outputs.drift == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fixture-drift
          path: fixture-drift.diff
          retention-days: 30

      - name: Post or refresh drift note on tracking issue
        if: ${{ failure() || steps.drift.outputs.drift == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MARKER="<!-- sandbox-drift-note -->"
          {
            echo "$MARKER"
            echo "## :rotating_light: Weekly sandbox check needs attention"
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            if [ "${{ steps.drift.outputs.drift }}" = "true" ]; then
              echo "**Fixture drift** detected against the committed corpus. Review the diff and update fixtures if the change is legitimate:"
              echo
              echo '```diff'
              head -c 60000 fixture-drift.diff
              echo
              echo '```'
            fi
            if [ "${{ steps.suite.outcome }}" = "failure" ]; then
              echo "**The sandbox suite failed.** See the run logs above."
            fi
            echo
            echo "_Updated $(date -u +'%Y-%m-%dT%H:%M:%SZ') by the sandbox workflow._"
          } > note.md

          REPO="${{ github.repository }}"
          COMMENT_ID=$(gh api "repos/${REPO}/issues/${TRACKING_ISSUE}/comments" --paginate \
            --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" | head -n1 || true)
          if [ -n "${COMMENT_ID}" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${COMMENT_ID}" -F body=@note.md
          else
            gh api -X POST "repos/${REPO}/issues/${TRACKING_ISSUE}/comments" -F body=@note.md
          fi
