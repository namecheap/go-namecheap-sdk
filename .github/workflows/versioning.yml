name: Versioning

# release-please maintains a long-lived "release PR" off the default branch.
# Merging that PR creates the vX.Y.Z tag and the GitHub release. Gated on a
# successful CI run so a release is only ever proposed/cut from green commits,
# and on the presence of a releasing commit (fix/feat/perf/revert/breaking)
# since the last tag, so docs:/chore:/ci: alone never open a release PR.
# See RELEASE.md for the full flow.
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - master
  workflow_dispatch:

# Serialize release-please runs: back-to-back merges to master produce
# overlapping CI successes that would otherwise race on the same release PR.
concurrency:
  group: release-please
  cancel-in-progress: false

# The default GITHUB_TOKEN needs nothing — every write goes through the App
# token generated below.
permissions: {}

jobs:
  releasing-commits:
    name: Check for releasing commits
    # The workflow_run branch filter matches the run's HEAD branch name, which
    # a fork PR can spoof by naming its branch "master" — hence the
    # head_repository guard. The conclusion guard is needed because
    # workflow_run also fires for failed CI runs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      # Full history and tags: the check walks commits since the last release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      # release-please would propose a patch release for any conventional
      # commit, including docs:/chore:/ci:. Only run it when something since
      # the last tag actually changes what consumers get (fix, feat, perf,
      # revert, a breaking change) or when a release PR was just merged.
      # A manual dispatch always runs it.
      - name: Look for releasing commits since the last tag
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            release="$(.github/scripts/has-releasing-commits.sh)"
            echo "release=$release" >> "$GITHUB_OUTPUT"
          fi

  release-please:
    needs: releasing-commits
    if: needs.releasing-commits.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      # A dedicated GitHub App authors the release PR. Events authored by the
      # default GITHUB_TOKEN do not re-trigger workflows; App-authored events do.
      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.generate-token.outputs.token }}
