name: Versioning

# release-please maintains a long-lived "release PR" off the default branch for
# each module: the SDK (tags vX.Y.Z) and otelnamecheap (tags
# otelnamecheap/vX.Y.Z). Merging one creates its tag and GitHub release. Gated on a
# successful CI run so a release is only ever proposed/cut from green commits.
# See RELEASE.md for the full flow.
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - master
  workflow_dispatch:

# Serialize release-please runs: back-to-back merges to master produce
# overlapping CI successes that would otherwise race on the same release PR.
concurrency:
  group: release-please
  cancel-in-progress: false

# The default GITHUB_TOKEN needs nothing — every write goes through the App
# token generated below.
permissions: {}

jobs:
  release-please:
    # The workflow_run branch filter matches the run's HEAD branch name, which
    # a fork PR can spoof by naming its branch "master" — hence the
    # head_repository guard. The conclusion guard is needed because
    # workflow_run also fires for failed CI runs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      # A dedicated GitHub App authors the release PR. Events authored by the
      # default GITHUB_TOKEN do not re-trigger workflows; App-authored events do.
      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.generate-token.outputs.token }}

      # release-please never sets make_latest, so GitHub marks the release it
      # created last as the repository's Latest. Give that label back to the
      # SDK after an otelnamecheap release, reading the SDK version from the
      # manifest on master.
      - name: Keep the SDK release marked as Latest
        if: steps.release.outputs['otelnamecheap--release_created'] == 'true'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/$GH_REPO/contents/.release-please-manifest.json" --jq '."."')
          gh release edit "v$version" --latest
